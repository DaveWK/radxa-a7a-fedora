# cubie-a7a-vdec: the video decoder (a733-cedrus) is loaded by
# cubie-a7a-hat.service after the PCK-600 power-domain driver and under its
# own hang guard, never by its device-tree alias at boot. udev would load it
# at coldplug, and it would then bind on its own the moment the PCK-600
# driver appears, outside the guard.
blacklist a733_cedrus
# Codec choice at load time (modinfo a733-cedrus): mpeg2, h264, hevc and vp8
# are on by default, hevc10, vp9 and jpeg off. Lasting changes belong in a
# file of your own, for example /etc/modprobe.d/a733-cedrus.conf:
#   options a733-cedrus vp9=1 jpeg=1
