# Cubie A7A AIC8800D80 (cubie-a7a-aic8800-usb).
# Bluetooth runs on the mainline btusb: once aic_load_fw has loaded the
# firmware (Bluetooth patches included), the D80 (a69c:8d81) has a standard
# Bluetooth interface (class e0/01/01) that btusb binds; hci0 works on it.
# The vendor aic_btusb is no longer built or shipped; this keeps a stray
# build of it (an older package's DKMS module, a manual build) from loading,
# by alias or by name.
blacklist aic_btusb
install aic_btusb /bin/false
