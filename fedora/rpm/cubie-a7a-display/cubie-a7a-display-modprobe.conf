# cubie-a7a-display: the HDMI display driver is loaded by
# cubie-a7a-hat.service after the PCK-600 power-domain driver and under its
# own hang guard, never by its device-tree alias at boot. udev would load it
# at coldplug, and its soft dependency would pull sun55i_pck600 in with it
# ahead of the service (softdeps ignore the board-support blacklist).
blacklist sunxidrm
