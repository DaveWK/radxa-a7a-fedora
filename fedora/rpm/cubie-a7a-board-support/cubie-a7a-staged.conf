# cubie-a7a-board-support: modules that are built and packaged but not yet
# loaded automatically. They are enabled one peripheral at a time after the
# first boot of the stock-kernel image (A7A-FEDORA-01); load one by hand with
# `modprobe <name>` to try it. Lifting a line here is a package update.
#
# USB3 / PCIe paired SerDes PHY (combo0/combo1)
blacklist sun60i_a733_serdes
# PCIe root complex (combo1, router HAT)
blacklist sun60i_a733_pcie
# PCK-600 power domains (stock module and the A733 override); with
# pd_ignore_unused the firmware's domain state stays as it is.
blacklist sun55i_pck600
