# cubie-a7a-board-support: the A733 builds of these modules (DKMS, extra/)
# replace Fedora's stock copies, which lack A733 support. Fedora ships no
# depmod search order, so without these lines depmod keeps the stock ones.
# sun6i-dma: only 7.2 and 7.3 kernels get an extra/ copy; from 7.4 on the
# stock module has the A733 and this line matches nothing.
override sun6i-dma * extra
override dwmac-sun55i * extra
override sun55i-pck600 * extra
override sun8i_thermal * extra
override nvmem_sunxi_sid * extra
