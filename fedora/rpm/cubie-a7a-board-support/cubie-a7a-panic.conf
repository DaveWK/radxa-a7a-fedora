# Radxa Cubie A7A (cubie-a7a-board-support): an oops or panic reboots.
#
# kernel.panic_on_oops = 1: an oops (a kernel BUG or fault in any context)
# panics instead of leaving a half-working kernel. On 2026-11-12 a
# "list_del corruption" BUG in process context left the board running with
# sshd resetting connections, needing a manual recovery.
# kernel.panic = 10: a panic reboots after 10 s (PSCI reset); with the dead
# SD slot the boot ROM then drops into USB FEL, so the board recovers by
# itself.
# Together with the WDT0 watchdog (60-cubie-a7a-watchdog.conf in
# /usr/lib/systemd/system.conf.d/: a hang with interrupts off, or a hung
# PID 1, resets within 16 s), any oops, panic or hang ends in a reset.
#
# systemd-sysctl applies this at boot, so an oops before it runs (early
# boot, initramfs) still uses the kernel defaults. Packages do not apply it
# at install time: the sysctls are not namespaced, and an image build in a
# container would change the build host's kernel. "sysctl --system" applies
# it on the board at once.
#
# To override, set the keys in /etc/sysctl.d/ (a file named
# 60-cubie-a7a-panic.conf there replaces this one; any file sorting after
# it overrides single keys), e.g. kernel.panic_on_oops = 0 while debugging
# an oops on the live system.
kernel.panic_on_oops = 1
kernel.panic = 10
