# Radxa Cubie A7A (cubie-a7a-board-support): PID 1 pets the A733 WDT0
# (/dev/watchdog0, sunxi_wdt, node from cubie-a7a-dtb binding stamp 22).
#
# A hung kernel or PID 1 then resets the SoC within 16 s, and the boot ROM
# falls back to the next boot medium or USB FEL, so the board recovers by
# itself instead of waiting for a power cycle or USB-C replug.
#
# 16 s is the hardware maximum: sunxi_wdt's max_timeout is 16 s and the
# watchdog core rejects any longer value (EINVAL), so systemd's default
# RebootWatchdogSec=10min cannot be programmed here either; it is set to
# 16 s so the final stage of a reboot or power-off is guarded too.
# systemd pets the device every 8 s (half the timeout).
#
# /usr/lib/sysctl.d/60-cubie-a7a-panic.conf (same package) makes an oops
# panic and a panic reboot after 10 s; this file covers what never panics.
#
# Without the WDT0 node (an older DTB) there is no /dev/watchdog0 and this
# file has no effect. To turn the watchdog off, put RuntimeWatchdogSec=off
# (and RebootWatchdogSec=off) under [Manager] in a file in
# /etc/systemd/system.conf.d/, or boot with systemd.watchdog_sec=0.
[Manager]
RuntimeWatchdogSec=16s
RebootWatchdogSec=16s
