# Radxa Cubie A7A (Allwinner A733) with a stock Fedora kernel.
#
# Generic (non-hostonly) initramfs: images are assembled off-board, and a
# host-only image built there would describe the build host.
hostonly="no"
# The A733 clock, pin and PMIC drivers and the A733 DMA controller come from
# cubie-a7a-kmods (DKMS, /usr/lib/modules/*/extra). Nothing on the SD card's
# path probes without them (every UART and I2C node also names a DMA
# channel), so load them first; dracut's own module matching only knows
# in-tree paths.
force_drivers+=" sun60i-a733-ccu pinctrl-sun60i-a733 axp318w axp318-regulator sun6i-dma "
# The rest of the root-on-SD path (stock modules): I2C for the PMIC, the MMC
# host.
add_drivers+=" i2c-mv64xxx sunxi-mmc "
# depmod inside the initramfs must also prefer the A733 sun6i-dma.
install_items+=" /usr/lib/depmod.d/cubie-a7a.conf "
