# Radxa Cubie A7A (Allwinner A733) with a stock Fedora kernel.
#
# Generic (non-hostonly) initramfs: images are assembled off-board, and a
# host-only image built there would describe the build host.
hostonly="no"
# The A733 clock and PMIC drivers come from cubie-a7a-kmods (DKMS,
# /usr/lib/modules/*/extra), and before Linux 7.4 the pin controller and the
# A733 DMA controller too. Nothing on the SD card's path probes without them
# (every UART and I2C node also names a DMA channel), so load them first;
# dracut's own module matching only knows in-tree paths.
# Each one only where this kernel has it as a module ($kernel is the version
# dracut builds for): Linux 7.4 has the A733 pin controllers built in
# (CONFIG_PINCTRL_SUN60I_A733=y), so there is no pinctrl-sun60i-a733.ko to
# force, and its sun6i-dma is the stock module.
for _cubie_m in sun60i-a733-ccu pinctrl-sun60i-a733 axp318w axp318-regulator sun6i-dma; do
    if modinfo -k "${kernel:-$(uname -r)}" "$_cubie_m" >/dev/null 2>&1; then
        force_drivers+=" $_cubie_m "
    fi
done
unset _cubie_m
# The rest of the root-on-SD path (stock modules): I2C for the PMIC, the MMC
# host.
add_drivers+=" i2c-mv64xxx sunxi-mmc "
# depmod inside the initramfs must also prefer the A733 sun6i-dma (7.3).
install_items+=" /usr/lib/depmod.d/cubie-a7a.conf "
