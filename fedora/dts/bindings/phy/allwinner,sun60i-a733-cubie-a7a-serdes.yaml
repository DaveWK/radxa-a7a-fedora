%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/allwinner,sun60i-a733-cubie-a7a-serdes.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#
title: Cubie A7A fixed paired USB3 and PCIe SERDES
maintainers:
  - DaveWK <13626476+DaveWK@users.noreply.github.com>
description: |
  Board-local native resource owner for fixed combo0 USB host and combo1 PCIe.
  The DWC3 child is populated only after the common bus is ready. One PHY
  argument selects PHY_TYPE_USB2, PHY_TYPE_USB3 or PHY_TYPE_PCIE; no DP or
  Type-C switching. The USB2 analog block and common resistance calibration
  have the same serialized owner. USB2 init runs after the DWC3 clocks start.
properties:
  compatible:
    const: allwinner,sun60i-a733-cubie-a7a-serdes
  reg:
    maxItems: 8
  reg-names:
    items:
      - const: subsys
      - const: map
      - const: combo0-top
      - const: combo0-phy
      - const: combo1-top
      - const: combo1-phy
      - const: usb2-phy
      - const: rescal
  clocks:
    maxItems: 6
  clock-names:
    items:
      - const: bus
      - const: mbus
      - const: cfg
      - const: ref0
      - const: ref1
      - const: rescal
  resets:
    maxItems: 1
  reset-names:
    const: serdes
  serdes1v8-supply:
    description: CLDO5 fixed 1.8V SERDES supply.
  power-domains:
    maxItems: 1
  "#phy-cells":
    const: 1
  "#address-cells":
    const: 1
  "#size-cells":
    const: 1
  ranges: true
patternProperties:
  "^usb@[0-9a-f]+$":
    $ref: /schemas/usb/snps,dwc3.yaml#
required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names
  - resets
  - reset-names
  - serdes1v8-supply
  - power-domains
  - "#phy-cells"
  - "#address-cells"
  - "#size-cells"
  - ranges
additionalProperties: false
