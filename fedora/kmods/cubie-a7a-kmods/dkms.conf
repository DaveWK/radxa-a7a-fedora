# cubie-a7a-kmods: Allwinner A733 / Radxa Cubie A7A drivers for a stock
# Fedora kernel. Sourced by dkms with $kernelver set.
PACKAGE_NAME="cubie-a7a-kmods"
PACKAGE_VERSION="@VERSION@"
AUTOINSTALL="yes"

# Boot-critical modules: private copies of the CCU, pinctrl and AXP cores
# (built into Fedora's vmlinux without A733 support). They use only public
# kernel headers.
BUILT_MODULE_NAME[0]="sun60i-a733-ccu"
DEST_MODULE_LOCATION[0]="/extra"
BUILT_MODULE_NAME[1]="pinctrl-sun60i-a733"
DEST_MODULE_LOCATION[1]="/extra"
BUILT_MODULE_NAME[2]="axp318w"
DEST_MODULE_LOCATION[2]="/extra"
BUILT_MODULE_NAME[3]="axp318-regulator"
BUILT_MODULE_LOCATION[3]="regulator/"
DEST_MODULE_LOCATION[3]="/extra"

# Overrides of the stock sun6i-dma, dwmac-sun55i and sun55i-pck600 (the
# package's depmod.d file makes depmod pick these extra/ copies). They embed
# kernel-internal headers (virt-dma.h, stmmac.h). The set is Fedora 7.3.3's;
# against 7.2.10 only three stmmac headers differ, in a field name, a
# prototype and two register macros (no layout change), so the same set is
# used for 7.2 and 7.3 kernels and nothing else. On another series they are not built, the package's kernel guard
# (/usr/libexec/cubie-a7a/kernel) finds the boot modules missing and keeps
# the previous kernel as the default until a header set for it is added.
overrides=n
case "$kernelver" in
	7.2.*|7.3.*) overrides=y ;;
esac
if [ "$overrides" = y ]; then
	BUILT_MODULE_NAME[4]="sun6i-dma"
	BUILT_MODULE_LOCATION[4]="dma/"
	DEST_MODULE_LOCATION[4]="/extra"
	BUILT_MODULE_NAME[5]="dwmac-sun55i"
	BUILT_MODULE_LOCATION[5]="stmmac/"
	DEST_MODULE_LOCATION[5]="/extra"
	BUILT_MODULE_NAME[6]="sun60i-a733-serdes"
	DEST_MODULE_LOCATION[6]="/extra"
	BUILT_MODULE_NAME[7]="sun60i-a733-pcie"
	DEST_MODULE_LOCATION[7]="/extra"
	BUILT_MODULE_NAME[8]="sun55i-pck600"
	BUILT_MODULE_LOCATION[8]="ppu/"
	DEST_MODULE_LOCATION[8]="/extra"
	BUILT_MODULE_NAME[9]="sun8i_thermal"
	DEST_MODULE_LOCATION[9]="/extra"
	BUILT_MODULE_NAME[10]="nvmem_sunxi_sid"
	DEST_MODULE_LOCATION[10]="/extra"
fi

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build CUBIE_OVERRIDES=${overrides} modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
