# cubie-a7a-kmods: Allwinner A733 / Radxa Cubie A7A drivers for a stock
# Fedora kernel. Sourced by dkms with $kernelver set.
PACKAGE_NAME="cubie-a7a-kmods"
PACKAGE_VERSION="@VERSION@"
AUTOINSTALL="yes"

# One table per kernel series (the board package's kernel helper,
# /usr/libexec/cubie-a7a/kernel, and fedora/release.sh hold the same one):
#   7.2, 7.3  everything below
#   7.4       no pinctrl-sun60i-a733 (the A733 pin controllers are built into
#             the kernel since v7.4-rc1, CONFIG_PINCTRL_SUN60I_A733=y in
#             Fedora's config; a module for the same compatibles would never
#             bind) and no sun6i-dma (the stock module has the A733)
#   other     only the CCU and AXP modules, which use public kernel headers
#             (no pinctrl module: mainline has the driver); the package's
#             kernel guard then finds dwmac-sun55i missing and keeps the
#             previous kernel as the default until a header set for the
#             series is added (stmmac/k<series>/, pcie/k<series>/)
cubie_series=
cubie_pinctrl=n
cubie_dma=n
case "$kernelver" in
	7.2.*|7.3.*) cubie_series=7.3; cubie_pinctrl=y; cubie_dma=y ;;
	7.4.*) cubie_series=7.4 ;;
esac

cubie_n=0
cubie_module() { # name [built location]
	BUILT_MODULE_NAME[cubie_n]="$1"
	[ -z "${2:-}" ] || BUILT_MODULE_LOCATION[cubie_n]="$2"
	DEST_MODULE_LOCATION[cubie_n]="/extra"
	cubie_n=$((cubie_n + 1))
}

# Boot-critical modules: private copies of the CCU and AXP cores (built into
# Fedora's vmlinux without A733 support) and, before 7.4, of the pinctrl
# core. They use only public kernel headers.
cubie_module sun60i-a733-ccu
[ "$cubie_pinctrl" = n ] || cubie_module pinctrl-sun60i-a733
cubie_module axp318w
cubie_module axp318-regulator regulator/

# Overrides of the stock dwmac-sun55i, sun55i-pck600, sun8i_thermal and
# nvmem_sunxi_sid, and before 7.4 of sun6i-dma (the package's depmod.d file
# makes depmod pick these extra/ copies), and the staged SerDes and PCIe
# drivers. dwmac-sun55i and the PCIe glue embed kernel-internal headers
# (stmmac.h, pcie-designware.h), kept per series: k7.3 is Fedora 7.3.3's
# stmmac set (against 7.2.10 only three headers differ, in a field name, a
# prototype and two register macros, no layout change) and 7.2.9's PCIe
# pair; k7.4 is Fedora 7.4.0-0.rc3's (PROVENANCE).
if [ -n "$cubie_series" ]; then
	[ "$cubie_dma" = n ] || cubie_module sun6i-dma dma/
	cubie_module dwmac-sun55i stmmac/
	cubie_module sun60i-a733-serdes
	cubie_module sun60i-a733-pcie
	cubie_module sun55i-pck600 ppu/
	cubie_module sun8i_thermal
	cubie_module nvmem_sunxi_sid
fi
unset -f cubie_module

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build CUBIE_SERIES=${cubie_series} CUBIE_PINCTRL=${cubie_pinctrl} modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
