# a733-cedrus: the sources are Fedora 7.3.3's cedrus and use that series'
# V4L2 stateless interfaces, so the module is only built for 7.3 kernels.
PACKAGE_NAME="a733-cedrus"
PACKAGE_VERSION="@VERSION@"
AUTOINSTALL="yes"
BUILT_MODULE_NAME[0]="a733-cedrus"
DEST_MODULE_LOCATION[0]="/extra"
BUILD_EXCLUSIVE_KERNEL="^7\.3\."
BUILD_EXCLUSIVE_ARCH="aarch64"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
